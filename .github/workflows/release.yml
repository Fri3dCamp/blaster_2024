name: PlatformIO CI

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio
          pio pkg install -g -p https://github.com/Community-PIO-CH32V/platform-ch32v.git

      - name: Parse Tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"

          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Invalid version tag: ${GITHUB_REF_NAME}"
            echo "Expected format: vMAJOR.MINOR.PATCH (e.g. v1.2.3)"
            exit 1
          fi

          echo "major=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "minor=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          echo "patch=${BASH_REMATCH[3]}" >> "$GITHUB_OUTPUT"

      - name: Run PlatformIO Build
        run: pio run -d Sources/2024_blaster -e release
        env:
          PLATFORMIO_BUILD_FLAGS: "-DVERSION_MAJOR=\\\"${{ steps.tag.outputs.major }}\\\" -DVERSION_MINOR=\\\"${{ steps.tag.outputs.minor }}\\\" -DVERSION_PATCH=\\\"${{ steps.tag.outputs.patch }}\\\""

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: true
          prerelease: false
          files: Sources/2024_blaster/.pio/build/**/firmware.bin

      - name: Publish to BadgeHub
        env:
          BADGEHUB_TOKEN: ${{ secrets.BADGEHUB_TOKEN }}
          BADGEHUB_PROJECT: blaster_2024
          FIRMWARE_PATH: Sources/2024_blaster/.pio/build/release/firmware.bin
        run: |
          set -euo pipefail

          api_url="https://badgehub.eu/api/v3/projects/${BADGEHUB_PROJECT}"
          release_version="${GITHUB_REF_NAME#v}"

          draft_metadata="$(
            curl --fail-with-body --retry 3 \
              --header "badgehub-api-token: ${BADGEHUB_TOKEN}" \
              "${api_url}/draft" \
              | jq --arg version "${release_version}" \
                  '.version.app_metadata | .version = $version'
          )"

          curl --fail-with-body --retry 3 --request PATCH \
            --header "badgehub-api-token: ${BADGEHUB_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "${draft_metadata}" \
            "${api_url}/draft/metadata"

          curl --fail-with-body --retry 3 --request POST \
            --header "badgehub-api-token: ${BADGEHUB_TOKEN}" \
            --form "file=@${FIRMWARE_PATH};type=application/octet-stream" \
            "${api_url}/draft/files/firmware.bin"

          curl --fail-with-body --retry 3 --request PATCH \
            --header "badgehub-api-token: ${BADGEHUB_TOKEN}" \
            "${api_url}/publish"
